        sync: false

envVarGroups:
  # Shared by every service. `sync: false` means Render does not read a value
  # from this file — it is set once in the dashboard and never lives in git.
  - name: tether-shared
    envVars:
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: JWT_JWKS_URL
        sync: false
      - key: JWT_ALGORITHM
        value: RS256
      - key: PUBLIC_API_URL
        sync: false
      # Exact origins. Empty denies everything, which is the intended failure
      # mode for a value nobody configured.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: BODY_LIMIT
        value: 512kb

  - name: tether-auth-secrets
    envVars:
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_ISSUER
        sync: false
      - key: JWT_PRIVATE_KEY_PEM
        sync: false
      - key: INTERNAL_SERVICE_TOKEN
        sync: false
