      - key: SERVICE_NAME
        value: website-service
      - key: PORT
        value: 8007
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # This service's own database login (`tether_website_login`, db/ROLES.md). Set in the
      # dashboard; never in git, and never the project's superuser DSN.
      - key: DATABASE_URL
        sync: false

  - type: pserv
    name: tether-chronic
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/chronic-service/Dockerfile
    dockerContext: .
