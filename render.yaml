      - key: DATABASE_URL
        sync: false

  - type: pserv
    name: tether-care-team
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/care-team-service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: care-team-service
      - key: PORT
        value: 8005
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # This service's own database login (`tether_care_team_login`, db/ROLES.md). Set in the
      # dashboard; never in git, and never the project's superuser DSN.
      - key: DATABASE_URL
        sync: false

  - type: pserv
    name: tether-notification
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/notification-service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: notification-service
      - key: PORT
        value: 8006
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # This service's own database login (`tether_notification_login`, db/ROLES.md). Set in the
      # dashboard; never in git, and never the project's superuser DSN.
      - key: DATABASE_URL
        sync: false
      # Absent by design in most environments: the service starts without it
      # and logs that push is disabled, rather than refusing to boot.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  - type: pserv
    name: tether-website
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/website-service/Dockerfile
    dockerContext: .
