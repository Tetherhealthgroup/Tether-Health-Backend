# Render Blueprint.
#
# One public service and nine private ones, which is the same topology the
# docker-compose stack uses locally: only the gateway is reachable from the
# internet, and everything behind it is on Render's private network.
#
# ── Read this before applying ────────────────────────────────────────────────
#
# Render was already connected to this repository by hand before this file
# existed. Applying a Blueprint takes ownership of the services it names, so
# check the dashboard first: if a service here has the same name as one already
# defined there, the Blueprint's definition wins and any manual configuration
# is replaced. Renaming a service in this file creates a new one and orphans
# the old.
#
# ── Why private services rather than nine public ones ────────────────────────
#
# `pserv` instances have no public URL and are reachable only from other
# services in the same Render account. That is the property the architecture
# depends on: each service verifies its own JWT, but nothing else stands
# between an internal service and the internet, so the network has to. It is
# also the one thing the model backend got right — its compose file published
# only the gateway.
#
# Private services are not available on Render's free tier. Ten services also
# bill as nine services; if that is the wrong shape commercially, the honest
# alternative is fewer, larger services rather than nine public ones.
#
# ── One database login per service ───────────────────────────────────────────
#
# `DATABASE_URL` is set on each service that touches Postgres, and is not in the
# `tether-shared` group. It used to be: one group, one value, and the value was
# the project's superuser DSN, which bypasses row-level security — so every
# service could read and delete every patient's rows (R-032). Each service now
# connects as its own `tether_<service>_login` role (migrations 0009 to 0011),
# which can reach only the schemas, tables and columns that service uses and to
# which RLS applies. `tether-api-gateway` holds no data and has no DSN.
#
# `sync: false` below means Render reads no value from this file. The operator
# creates each role's password out of band and pastes the matching DSN in the
# dashboard: see db/ROLES.md for the order, and do it before the first deploy
# of a build that contains these migrations.
#
# ── Not covered here ─────────────────────────────────────────────────────────
#
# Migrations. Nothing in this file applies them, deliberately: an auto-deploy
# that also migrates means an unreviewed schema change reaching production on a
# merge, which is exactly what the model repo did. Run `supabase db push`
# behind an approval.

services:
  # ── Public ─────────────────────────────────────────────────────────────────
  - type: web
    name: tether-api-gateway
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/api-gateway/Dockerfile
    # Repo root, so the npm workspace resolves inside the image. A context of
    # the service directory is what made the model repo's shared package
    # permanently unimportable.
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: api-gateway
      - key: PORT
        value: 8000
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # Render substitutes each private service's internal host:port.
      - key: AUTH_SERVICE_URL
        fromService: { type: pserv, name: tether-auth, property: connectionString }
      - key: CATALOGUE_SERVICE_URL
        fromService: { type: pserv, name: tether-catalogue, property: connectionString }
      - key: ENROLMENT_SERVICE_URL
        fromService: { type: pserv, name: tether-enrolment, property: connectionString }
      - key: RECORDS_SERVICE_URL
        fromService: { type: pserv, name: tether-records, property: connectionString }
      - key: CARE_TEAM_SERVICE_URL
        fromService: { type: pserv, name: tether-care-team, property: connectionString }
      - key: NOTIFICATION_SERVICE_URL
        fromService: { type: pserv, name: tether-notification, property: connectionString }
      - key: WEBSITE_SERVICE_URL
        fromService: { type: pserv, name: tether-website, property: connectionString }
      - key: CHRONIC_SERVICE_URL
        fromService: { type: pserv, name: tether-chronic, property: connectionString }
      - key: REALTIME_SERVICE_URL
        fromService: { type: pserv, name: tether-realtime, property: connectionString }

  # ── Private ────────────────────────────────────────────────────────────────
  - type: pserv
    name: tether-auth
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/auth-service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: auth-service
      - key: PORT
        value: 8001
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # This service's own database login (`tether_auth_login`, db/ROLES.md). Set in the
      # dashboard; never in git, and never the project's superuser DSN.
      - key: DATABASE_URL
        sync: false
      - fromGroup: tether-auth-secrets

  - type: pserv
    name: tether-catalogue
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/catalogue-service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: catalogue-service
      - key: PORT
        value: 8002
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # This service's own database login (`tether_catalogue_login`, db/ROLES.md). Set in the
      # dashboard; never in git, and never the project's superuser DSN.
      - key: DATABASE_URL
        sync: false

  - type: pserv
    name: tether-enrolment
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/enrolment-service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: enrolment-service
      - key: PORT
        value: 8003
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # This service's own database login (`tether_enrolment_login`, db/ROLES.md). Set in the
      # dashboard; never in git, and never the project's superuser DSN.
      - key: DATABASE_URL
        sync: false

  - type: pserv
    name: tether-records
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./services/records-service/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: records-service
      - key: PORT
        value: 8004
      - key: NODE_ENV
        value: production
      - fromGroup: tether-shared
      # This service's own database login (`tether_records_login`, db/ROLES.md). Set in the
